<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#121017" />
  <title>HERMES · Architecture Atlas</title>
  <link rel="stylesheet" href="atlas.css">
</head>
<body>
  <div class="shell">
    <header class="app">
      <button class="icon-btn" id="menu-btn" aria-label="Menu">☰</button>
      <div class="brand"><strong>HERMES</strong><span>Architecture Atlas</span></div>
      <button class="icon-btn" id="search-btn" aria-label="Search">⌕</button>
      <div class="sync"><span class="dot"></span> Synced from disk</div>
    </header>
    <nav class="tabs" role="tablist">
      <button class="tab" id="tab-atlas" role="tab" aria-selected="true">Atlas</button>
      <button class="tab" id="tab-flow" role="tab" aria-selected="false">Flow</button>
      <button class="tab" id="tab-files" role="tab" aria-selected="false">Files</button>
    </nav>
    <main class="stage">
      <section class="pane active" id="pane-atlas">
        <div class="viewport" id="view-atlas"><div class="world" id="world-atlas"></div></div>
        <div class="minimap" id="minimap"><canvas id="mini-c"></canvas></div>
        <div class="hud"><button class="btn" data-fit="atlas">Fit</button><button class="btn" id="phys-btn">Physics on</button><span class="chip">Drag · pinch · tap</span></div>
      </section>
      <section class="pane" id="pane-flow">
        <div class="intro"><h2>System flow</h2><p>Request path plus correction and learning-edge feedback. Pan and pinch.</p></div>
        <div class="viewport" id="view-flow"><div class="world" id="world-flow"></div></div>
        <div class="hud"><button class="btn" data-fit="flow">Fit</button></div>
      </section>
      <section class="pane" id="pane-files">
        <div class="intro"><h2>Every file and document</h2><p>Grounded in ~/.hermes/profiles/ and doctrine drop-ins. Pan and pinch.</p></div>
        <div class="viewport" id="view-files"><div class="world" id="world-files"></div></div>
        <div class="hud"><button class="btn" data-fit="files">Fit</button></div>
      </section>
      <aside class="sheet" id="sheet"><div class="kind" id="sheet-kind">node</div><h3 id="sheet-title">—</h3><p id="sheet-body"></p></aside>
      <div class="search" id="search"><input id="q" type="search" placeholder="Search nodes, files, loops…" autocomplete="off" /><div class="hits" id="hits"></div></div>
    </main>
    <footer class="status"><span><b id="n-nodes">29</b> nodes</span><span><b id="n-edges">29</b> edges</span><span><b id="n-zoom">100%</b> zoom</span><span id="n-phys">on physics</span><span class="end">Hermes</span></footer>
  </div>
  <script src="data.js"></script>
  <script src="engine.js"></script>
</body>
</html>
